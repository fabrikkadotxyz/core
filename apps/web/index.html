<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabrikka</title>
    <!--
      What a search result or a pasted link shows (docs/operations.md, "Link
      previews and search engines"). The image and the address are site-relative
      here; the server makes them absolute with its PUBLIC_URL when it serves
      the page, so every instance previews as itself.
    -->
    <meta name="description" content="Multiplayer AI: a room where your team and the agents you already use (Claude Code, Codex, any MCP client) work one problem together, live. Self-hosted, free software." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fabrikka" />
    <meta property="og:title" content="Fabrikka — Multiplayer AI" />
    <meta property="og:description" content="One room for your team and the AI agents it already uses. Anyone in the room can watch an agent work, redirect it and hand it off." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="Fabrikka: multiplayer AI. One room for your team and the agents it already uses." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fabrikka — Multiplayer AI" />
    <meta name="twitter:description" content="One room for your team and the AI agents it already uses." />
    <meta name="twitter:image" content="/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Fabrikka",
        "url": "/",
        "image": "/og-image.png",
        "description": "Multiplayer AI: a room where a team and the AI agents its members already use work one problem together, live.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, macOS, Windows, Linux",
        "license": "https://www.gnu.org/licenses/agpl-3.0.html",
        "sameAs": ["https://fabrikka.xyz", "https://github.com/fabrikkadotxyz/core"]
      }
    </script>
    <!-- The mark (brand/README.md): SVG for modern browsers, .ico for the rest. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#293241" />
  </head>
  <body>
    <!--
      M44: paint the chosen theme from the first frame. The choice is cached on
      the device (src/themes.ts); the account's choice replaces it once it loads.
      document.write makes the stylesheet render-blocking, so there's no flash.
    -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('fabrikka.theme') || 'null');
        // No choice yet (or none cached): the default, Fabrikka (ADR 0038, amended).
        var id = t && t.choice ? t.id : 'fabrikka';
        if (t && t.choice === 'system') id = matchMedia('(prefers-color-scheme: dark)').matches ? 'dusk-night' : 'dusk';
        if (id && /^[a-z0-9-]{1,40}$/.test(id) && id !== 'dusk') {
          document.documentElement.dataset.theme = id;
          document.write('<link id="theme-css" rel="stylesheet" href="/themes/' + id + '/theme.css">');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
