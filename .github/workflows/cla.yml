# The CLA check (ADR 0034): on a contributor's first pull request it asks them
# to agree to CLA.md by posting one comment, and records the agreement on the
# cla-signatures branch, so it is asked only once. It never checks out or runs
# the pull request's code, which is why pull_request_target is safe here.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/fabrikkadotxyz/core/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: federicoaldunate,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
