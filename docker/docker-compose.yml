services:
  postgres:
    image: postgres:17-alpine
    container_name: fabrikka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fabrikka
      POSTGRES_PASSWORD: fabrikka
      POSTGRES_DB: fabrikka
    ports:
      - "5433:5432"
    volumes:
      - fabrikka-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabrikka -d fabrikka"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fabrikka-pgdata:
