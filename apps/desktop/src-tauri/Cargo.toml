[package]
name = "fabrikka-desktop"
version = "0.0.0"
edition = "2021"
description = "Fabrikka desktop shell"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
