[package]
name = "fabrikka-desktop"
version = "0.0.0"
edition = "2021"
description = "Fabrikka desktop shell"
license = "AGPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# M34 (ADR 0031): the tray; the host as a sidecar; the native folder picker;
# start at login; one running app at a time.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# M42 (ADR 0037): system notifications when a room needs you.
tauri-plugin-notification = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
